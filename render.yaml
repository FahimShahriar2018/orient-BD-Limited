databases:
  - name: orient-db
    databaseName: orient_db
    user: orient_user
    plan: free

services:
  - type: web
    name: orient-bd
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn orient.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: orient-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.9"
